task_name: Place the green cube on top of the red cube.
turn_budget: 20
max_retries: 3
total_trials: 1
num_workers: 1
output_dir: data/collect/cube_stack_reverse
sim:
  task: cube_stack_reverse
  motion_speed: 0.5
  visualize: true
  perception: sam3
  grasp: pca
  camera_views: [frontview]
  camera:
    name: frontview
    width: 512
    height: 512
  object_aliases:
    red cube: cubeA
    green cube: cubeB
  randomize:
    x_range:
    - -0.18
    - 0.18
    y_range:
    - -0.12
    - 0.12
    rotation: true
    colors: false
    lighting: true
    seed: null
robot:
  sam3_url: http://127.0.0.1:8114
  sam3_debug: false
  bbox_debug: false
llm:
  temperature: 1.0
  max_tokens: 2048

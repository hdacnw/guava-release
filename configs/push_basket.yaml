task_name: "Push the basket."
turn_budget: 20
max_retries: 3
total_trials: 1
num_workers: 1
output_dir: data/collect/push_basket

push_directions:
  - left

sim:
  task: push_basket
  motion_speed: 0.5
  visualize: true
  perception: sam3
  camera_views: [frontview]
  camera:
    name: frontview
    width: 512
    height: 512
  object_aliases:
    basket: basket
  randomize:
    colors: false
    lighting: true
    seed: null

basket_randomize:
  x_range: [-0.1, 0.1]
  y_range: [-0.2, 0.2]
  rotation: true

robot:
  sam3_url: "http://127.0.0.1:8114"
  sam3_debug: false
  bbox_debug: false

llm:
  temperature: 1.0
  max_tokens: 2048

task_name: "Place all red objects into the basket."
turn_budget: 25
max_retries: 3
total_trials: 1
num_workers: 1
output_dir: data/collect/red_objects_in_basket
stop_on_reward: false

sim:
  task: red_objects_in_basket
  motion_speed: 5
  visualize: true
  perception: sam3
  camera_views: [frontview]
  camera:
    name: frontview
    width: 512
    height: 512
  object_aliases:
    tomato: tomato
    can: can
    potato: potato
    pear: pear
    basket: basket
  randomize:
    colors: false
    lighting: true
    seed: null

basket_randomize:
  x_range: [-0.08, 0.08]
  y_range: [0.10, 0.20]

small_randomize:
  x_range: [-0.25, 0.25]
  y_range: [-0.25, -0.05]

robot:
  sam3_url: "http://127.0.0.1:8114"
  sam3_debug: false
  bbox_debug: false

llm:
  temperature: 1.0
  max_tokens: 2048

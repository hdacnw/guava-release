task_name: "Close the opened top drawer."
turn_budget: 15
max_retries: 3
total_trials: 1
num_workers: 1
output_dir: data/collect/close_drawer

sim:
  task: close_drawer
  motion_speed: 0.5
  visualize: true
  perception: sam3
  grasp: pca
  camera_views: [frontview]
  camera:
    name: frontview
    width: 512
    height: 512
  object_aliases:
    drawer: cabinet_top_region
  randomize:
    x_range: [-0.1, 0.1]
    y_range: [0.0, 0.0]
    colors: false
    lighting: true
    seed: null

robot:
  sam3_url: http://127.0.0.1:8114
  sam3_debug: false
  bbox_debug: false

llm:
  temperature: 1.0
  max_tokens: 2048

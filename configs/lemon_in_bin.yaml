task_name: "Place the lemon inside the box."
turn_budget: 25
max_retries: 3
total_trials: 1
num_workers: 1
output_dir: data/collect/lemon_in_bin
stop_on_reward: false

sim:
  task: lemon_in_bin
  motion_speed: 1.0
  visualize: true   # headless eval; viewer would force a display
  perception: sam3
  grasp: pca
  camera_views: [frontview]
  camera:
    name: frontview
    width: 512
    height: 512
  object_aliases:
    lemon: lemon
    box: bin_root
  randomize:
    x_range: [-0.15, 0.10]
    y_range: [-0.3, -0.15]    # lemon spawns away from the bin (which is at y≈0.17)
    rotation: true
    colors: false
    lighting: true
    seed: null

robot:
  sam3_url: "http://127.0.0.1:8114"
  sam3_debug: false

llm:
  temperature: 1.0
  max_tokens: 2048

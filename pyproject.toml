[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guava"
version = "0.1.0"
description = "A harness and model distillation framework for agentic manipulation."
requires-python = "==3.11.*"
# Lightweight shared dependencies; GPU stacks belong to separate groups below.
dependencies = ["numpy>=1.26", "Pillow", "requests", "pyyaml", "tyro>=0.8.5"]

[dependency-groups]
# Simulator, hosted-model clients, collection, and dataset preparation.
eval = [
    "numpy==1.26.4", "mujoco==3.6.0", "robosuite",
    "viser>=0.2.0", "pybullet>=3.2.7", "openai>=2.33.0",
    "scipy>=1.12", "imageio[ffmpeg]>=2.34.0", "h5py>=3.16.0",
    "gymnasium>=1.2.3", "opencv-python==4.11.0.86", "pyopengl>=3.1.7",
    "huggingface-hub>=1.11.0", "setuptools", "fastapi", "uvicorn[standard]",
    # Optional GraspGen client only; its server needs a separate installation.
    "pyzmq>=26.0", "msgpack>=1.1", "msgpack-numpy>=0.4.8",
]
# SAM3 perception server, isolated from vLLM's newer Torch stack.
sam3 = [
    "sam3", "torch==2.9.1", "torchvision==0.24.1",
    "fastapi", "uvicorn[standard]", "einops",
    "pycocotools>=2.0.11", "scipy>=1.12", "opencv-python==4.11.0.86", "psutil",
]
# Local Qwen / Guava VLM server; omit when using hosted models.
serve = [
    "vllm==0.29.0", "torch==2.13.0+cu130", "torchvision==0.28.0+cu130",
    "torchaudio==2.11.0+cu130", "ninja>=1.13.2",
    # Keep the JIT compiler and headers on the same CUDA release as Torch.
    "cuda-toolkit[nvcc,cccl]==13.0.3.0",
]

[tool.uv]
default-groups = ["eval"]
# One lockfile, separate environments. Never install all three together.
conflicts = [[{group = "eval"}, {group = "sam3"}, {group = "serve"}]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
robosuite = { path = "third_party/robosuite", editable = true }
sam3 = { path = "third_party/sam3", editable = true }
torch = [{ index = "pytorch-cu130", group = "serve" }]
torchvision = [{ index = "pytorch-cu130", group = "serve" }]
torchaudio = [{ index = "pytorch-cu130", group = "serve" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["guava*"]

[tool.setuptools.package-data]
"guava.collection" = ["*.txt"]
"guava.sim" = ["controllers/*.json"]
